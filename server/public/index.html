<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cerca · Panel familiar</title>
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" hidden aria-label="Volver">←</button>
    <h1 id="title">Cerca</h1>
    <button id="logout" class="link-btn" hidden>Salir</button>
  </header>
  <main id="view"></main>
  <div id="savebar" class="savebar" hidden>
    <span>Tienes cambios sin guardar</span>
    <button id="discard" class="btn ghost">Descartar</button>
    <button id="save" class="btn primary">Guardar y enviar al móvil</button>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
